<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator Premium Pro</title>

    <link rel="icon" href="appleLogo.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://s3.tradingview.com/tv.js"></script>

    <style>
        body {
            font-family: Inter, sans-serif;
            background: #0d1117;
        }

        .number-btn {
            background: #1f2937;
            color: white;
            border-radius: 18px;
            height: 80px;
            font-size: 30px;
            font-weight: 600;
            transition: .2s;
        }

        .number-btn:hover {
            background: #374151;
        }

        .operator-btn {
            background: #2962ff;
            color: white;
            border-radius: 18px;
            height: 80px;
            font-size: 30px;
            font-weight: 700;
        }

        .operator-btn:hover {
            background: #1d4ed8;
        }
    </style>

</head>

<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-7xl">

        <!-- Kalkulator -->
        <div id="calculatorPage">

            <div class="bg-[#161b22] rounded-[30px] p-8 border border-slate-800 shadow-2xl">

                <h1 class="text-white text-4xl font-bold">
                    Kalkulator Premium
                </h1>

                <p class="text-slate-400 mt-2">
                    Hasil terkunci sebelum pembayaran
                </p>

                <input id="display" readonly
                    class="w-full h-40 mt-8 bg-[#0d1117] border border-slate-800 rounded-3xl text-right px-8 text-6xl text-white">

                <div class="grid grid-cols-4 gap-4 mt-8">

                    <button onclick="clearDisplay()" class="number-btn">
                        AC
                    </button>

                    <button onclick="backspace()" class="number-btn">
                        ⌫
                    </button>

                    <button onclick="appendOperator('%')" class="number-btn">
                        %
                    </button>

                    <button onclick="appendOperator('/')" class="operator-btn">
                        ÷
                    </button>

                    <button onclick="appendValue('7')" class="number-btn">7</button>
                    <button onclick="appendValue('8')" class="number-btn">8</button>
                    <button onclick="appendValue('9')" class="number-btn">9</button>
                    <button onclick="appendOperator('*')" class="operator-btn">×</button>

                    <button onclick="appendValue('4')" class="number-btn">4</button>
                    <button onclick="appendValue('5')" class="number-btn">5</button>
                    <button onclick="appendValue('6')" class="number-btn">6</button>
                    <button onclick="appendOperator('-')" class="operator-btn">−</button>

                    <button onclick="appendValue('1')" class="number-btn">1</button>
                    <button onclick="appendValue('2')" class="number-btn">2</button>
                    <button onclick="appendValue('3')" class="number-btn">3</button>
                    <button onclick="appendOperator('+')" class="operator-btn">+</button>

                    <button onclick="appendValue('0')" class="number-btn col-span-2">
                        0
                    </button>

                    <button onclick="appendDecimal()" class="number-btn">
                        .
                    </button>

                    <button onclick="showPaymentModal()" class="operator-btn">
                        =
                    </button>

                </div>

            </div>

        </div>

        <!-- Dashboard Kurs -->
        <div id="exchangePage" class="hidden">

    <div class="bg-[#161b22] rounded-[30px] p-8 border border-slate-800">

        <div class="max-w-7xl mx-auto">

            <div class="flex justify-between items-center mb-6">

                <div>

                    <h1 class="text-white text-5xl font-bold">
                        USD / IDR Live
                    </h1>

                    <p class="text-slate-400 mt-2">
                        Data langsung dari TradingView
                    </p>

                </div>

                <button
                onclick="backToCalculator()"
                class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-3 rounded-xl">

                    ← Kembali

                </button>

            </div>

            <div class="bg-[#161b22] rounded-3xl p-4 border border-slate-800">

                <div
                id="tradingview_chart"
                style="height:800px;">
                </div>

            </div>

        </div>

    </div>

</div>

    </div>
    <div id="modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center">

        <div class="bg-[#161b22] rounded-3xl p-8 w-[450px]">

            <h2 class="text-white text-3xl font-bold">
                Hasil Terkunci
            </h2>

            <p class="text-slate-400 mt-4">
                Untuk melihat hasil, lakukan pembayaran.
            </p>

            <div class="text-5xl text-white font-black mt-6">
                Rp18.000
            </div>

            <div class="grid grid-cols-2 gap-3 mt-8">

                <button onclick="closeModal()" class="h-14 rounded-xl bg-slate-700 text-white">

                    Batal

                </button>

                <button onclick="fakePayment()" class="h-14 rounded-xl bg-blue-600 text-white">

                    Bayar

                </button>

            </div>

        </div>

    </div>
    <script>

        const display =
            document.getElementById('display');

        function appendValue(v) {
            display.value += v;
        }

        function clearDisplay() {
            display.value = '';
        }

        function backspace() {
            display.value =
                display.value.slice(0, -1);
        }

        function appendOperator(op) {

            if (display.value === '') return;

            const last =
                display.value.slice(-1);

            const ops =
                ['+', '-', '*', '/', '%'];

            if (ops.includes(last)) {

                display.value =
                    display.value.slice(0, -1) + op;

                return;
            }

            display.value += op;
        }

        function appendDecimal() {

            const lastNumber =
                display.value
                    .split(/[\+\-\*\/%]/)
                    .pop();

            if (!lastNumber.includes('.')) {
                display.value += '.';
            }

        }

        function showPaymentModal() {

            if (display.value === '') return;

            document
                .getElementById('modal')
                .classList.remove('hidden');
        }

        function closeModal() {

            document
                .getElementById('modal')
                .classList.add('hidden');
        }



        function fakePayment() {

            closeModal();

            document
                .getElementById('calculatorPage')
                .classList.add('hidden');

            document
                .getElementById('exchangePage')
                .classList.remove('hidden');



            setTimeout(() => {

                new TradingView.widget({

                    container_id:
                        "tradingview_chart",

                    autosize: true,

                    symbol:
                        "FX_IDC:USDIDR",

                    interval: "D",

                    theme: "dark",

                    style: "1",

                    locale: "id",

                    timezone: "Asia/Jakarta",

                    allow_symbol_change: false,

                    hide_side_toolbar: false,

                    withdateranges: true,

                    details: true

                });

            }, 500);

        }

        function backToCalculator() {

            document
                .getElementById('exchangePage')
                .classList.add('hidden');

            document
                .getElementById('calculatorPage')
                .classList.remove('hidden');

        }

    </script>

</body>

</html>
